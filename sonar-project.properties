# Required metadata
sonar.projectKey=sargen_frontend
sonar.projectName=Sargen Frontend
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.tsx,**/__tests__/**,**/*.d.ts,.next/**,coverage/**

# Language-specific configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=eslint-report.json

# Optional: Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server details (only needed if not configured in Jenkins)
# sonar.host.url=http://localhost:9000
# sonar.login=your_sonarqube_token
